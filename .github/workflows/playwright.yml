name: Playwright Tests

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      test_type:
        description: Which tests to run
        type: choice
        default: fresh
        options:
          - fresh     
          - setup      
          - flows    
          - features
          - projects
      projects:
        description: 'Only for test_type=projects: project names separated by spaces or commas (e.g. students academic)'
        type: string
        default: ''
concurrency:
  group: skulba-remote
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        BACKEND_URL: ${{ secrets.BACKEND_URL }}
        TEST_RESET_SECRET: ${{ secrets.TEST_RESET_SECRET }}
        TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
        TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
        TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        INVALID_TEST_USER_PASSWORD: ${{ secrets.INVALID_TEST_USER_PASSWORD }}
        LOGIN_SUCCESS_PATTERN: ${{ secrets.LOGIN_SUCCESS_PATTERN }}
        TEST_TYPE: ${{ (github.event_name == 'workflow_dispatch' && inputs.test_type) || 'fresh' }}
        PROJECTS: ${{ inputs.projects }}
      run: |
        if [ "$TEST_TYPE" = "projects" ]; then
          args=""
          for p in $(echo "$PROJECTS" | tr ',' ' '); do args="$args --project=$p"; done
          if [ -z "$args" ]; then echo "test_type=projects needs the projects input"; exit 1; fi
          npx playwright test $args --workers=1 --retries=0 --reporter=list
        else
          npm run test:$TEST_TYPE
        fi
    - name: Deploy report to GitHub Pages
      if: ${{ !cancelled() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: playwright-report
